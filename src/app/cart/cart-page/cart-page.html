<div class="cart-summary">
    @for (product of cartService.cartProducts(); track product.product.id) {

      <app-cart-item [product]="product" (addToCart)="onAddToCart($event)" (removeToCart)="onRemoveToCart($event)" class="items" />
    } @empty {
      <div class="empty-state">
        <p>No products in the cart</p>
      </div>
    }
  </div>
